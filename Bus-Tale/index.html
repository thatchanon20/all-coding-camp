<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>The Fabulous Bus Journey: Phitsanulok v1.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #d35400;
            --accent-dark: #a84300;
            --panel-bg: rgba(255, 250, 240, 0.95);
        }
        html, body {
            margin: 0;
            height: 100%;
            background: #ff9d5c;
            color: #3a2b22;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        .ui-panel {
            position: absolute;
            top: calc(25px + env(safe-area-inset-top, 0px));
            left: 25px;
            z-index: 100;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid rgba(211, 84, 0, 0.35);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            max-width: 260px;
            pointer-events: auto;
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-row {
            margin-bottom: 10px;
            font-size: 0.85rem;
        }

        .label {
            font-size: 0.65rem;
            color: #8a6f5f;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .value {
            color: #3a2b22;
            font-weight: 600;
            font-size: 1rem;
        }

        .control-group {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
        }

        input[type=range] {
            width: 100%;
            cursor: pointer;
            accent-color: var(--accent);
            margin-top: 5px;
        }

        .cam-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        button {
            background: #fff;
            border: 1.5px solid var(--accent);
            color: var(--accent);
            padding: 8px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 700;
            transition: all 0.2s;
        }

        button.active {
            background: var(--accent);
            color: #fff;
        }

        button:hover {
            background: #fff2e6;
        }

        .location-bubble {
            position: absolute;
            bottom: calc(35px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(211, 84, 0, 0.95);
            color: white;
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            z-index: 100;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.25);
            white-space: nowrap;
        }

        .footer {
            position: absolute;
            bottom: calc(15px + env(safe-area-inset-bottom, 0px));
            right: 25px;
            text-align: right;
            font-size: 0.7rem;
            color: #4a3524;
            font-weight: 600;
            opacity: 0.65;
        }
    </style>
</head>

<body>

    <div class="ui-panel">
        <h1>🚌 Fabulous Bus Journey</h1>
        <div class="data-row">
            <div class="label">🕙 Journey Clock</div>
            <div class="value" id="timeLog">08:00</div>
        </div>

        <div class="control-group">
            <div class="label">⚙️ Cruising Speed</div>
            <input type="range" id="speedSlider" min="1" max="50" value="5">
        </div>

        <div class="control-group">
            <div class="label">🎥 View Mode</div>
            <div class="cam-btns">
                <button id="viewOrbit" class="active">🔄 Free Look</button>
                <button id="viewTop">☁️ Map Mode</button>
                <button id="viewFront">🚍 Driver</button>
                <button id="viewSide">🛣️ Scenic</button>
            </div>
        </div>
    </div>

    <div class="location-bubble" id="currentInfo">🚌 Bus Route: Chiang Mai</div>
    <div class="footer">Chisanupong's Masterpiece • Bus Edition • Fabulous &amp; Butter-Smooth</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
        import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

        // --- Bus Stops (replaces the old rail-station waypoints) ---
        const routeStops = [
            { name: "เชียงใหม่ (Chiang Mai)", lat: 18.7883, lon: 98.9853, color: 0xff6b6b, time: "08:00" },
            { name: "ลำพูน (Lamphun)", lat: 18.5772, lon: 99.0084, color: 0xffd93d, time: "08:45" },
            { name: "ลำปาง (Lampang)", lat: 18.2917, lon: 99.4923, color: 0x6bcb77, time: "10:10" },
            { name: "อุตรดิตถ์ (Uttaradit)", lat: 17.6334, lon: 100.0988, color: 0x4d96ff, time: "12:30" },
            { name: "พิษณุโลก (Phitsanulok)", lat: 16.8211, lon: 100.2659, color: 0xb983ff, time: "14:15" }
        ];

        function timeToMin(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }
        function minToTime(m) {
            m = ((m % 1440) + 1440) % 1440;
            const h = Math.floor(m / 60), mm = Math.round(m % 60);
            return String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
        }

        // Build a dense journey timeline by interpolating between bus stops
        const journeyData = [];
        const segsPerLeg = 50;
        for (let s = 0; s < routeStops.length - 1; s++) {
            const a = routeStops[s], b = routeStops[s + 1];
            for (let i = 0; i < segsPerLeg; i++) {
                const t = i / segsPerLeg;
                journeyData.push({
                    lat: a.lat + (b.lat - a.lat) * t,
                    lon: a.lon + (b.lon - a.lon) * t,
                    place: t < 0.5 ? ("ออกจาก " + a.name) : ("มุ่งหน้าสู่ " + b.name),
                    time: minToTime(timeToMin(a.time) + (timeToMin(b.time) - timeToMin(a.time)) * t)
                });
            }
        }
        const last = routeStops[routeStops.length - 1];
        journeyData.push({ lat: last.lat, lon: last.lon, place: "ถึงจุดหมาย " + last.name, time: last.time });

        // --- Core Context ---
        const scale = 1800;
        const startLat = journeyData[0].lat;
        const startLon = journeyData[0].lon;
        const pts = journeyData.map(p => new THREE.Vector3((p.lon - startLon) * scale, 0, -(p.lat - startLat) * scale));
        const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);
        const pathResolution = 4000;
        const sampledPoints = curve.getSpacedPoints(pathResolution);

        // --- Scene Logic ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xff9d5c);
        scene.fog = new THREE.Fog(0xff9d5c, 100, 1500);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 4000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- Lights ---
        const ambient = new THREE.AmbientLight(0xfff1e0, 1.0); scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffd9a0, 2.0);
        sun.position.set(200, 400, 100); sun.castShadow = true;
        scene.add(sun);

        // --- Terrain & Road (replaces rails) ---
        const floorGeo = new THREE.CircleGeometry(3000, 32);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xd9c48a, roughness: 0.85 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2; floor.position.y = -0.6; floor.receiveShadow = true; scene.add(floor);

        // Asphalt road surface following the route
        const roadGeo = new THREE.TubeGeometry(curve, 2000, 2.6, 8, false);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3f, roughness: 0.9, metalness: 0.05 });
        scene.add(new THREE.Mesh(roadGeo, roadMat));

        function createFabulousNature() {
            // Hills
            for (let i = 0; i < 30; i++) {
                const mt = new THREE.Mesh(new THREE.ConeGeometry(50 + Math.random() * 50, 70 + Math.random() * 80, 4), new THREE.MeshStandardMaterial({ color: 0x7d3c98 }));
                const r = 1100 + Math.random() * 600;
                const a = Math.random() * Math.PI * 2;
                mt.position.set(Math.cos(a) * r, 20, Math.sin(a) * r);
                scene.add(mt);
            }

            const itemSpacing = 6;
            const count = Math.floor(sampledPoints.length / itemSpacing);

            // Flower clusters (merged geometry)
            const flGeo1 = new THREE.SphereGeometry(0.5, 6, 6).translate(0, 0, 0);
            const flGeo2 = new THREE.SphereGeometry(0.4, 6, 6).translate(0.6, 0.2, 0.4);
            const flGeo3 = new THREE.SphereGeometry(0.4, 6, 6).translate(-0.6, 0.1, -0.4);
            const clusterGeo = BufferGeometryUtils.mergeBufferGeometries([flGeo1, flGeo2, flGeo3]);

            const flowerColors = [0xff1493, 0xffd700, 0x00e5ff, 0xff6b35, 0xffffff];
            const flowerInsts = flowerColors.map(c => new THREE.InstancedMesh(clusterGeo, new THREE.MeshStandardMaterial({ color: c }), Math.ceil(count / 5)));

            // Roadside trees (merged geometry)
            const trunkGeo = new THREE.CylinderGeometry(0.3, 0.4, 6).translate(0, 3, 0);
            const lv1 = new THREE.ConeGeometry(3, 4, 8).translate(0, 6, 0);
            const lv2 = new THREE.ConeGeometry(2.2, 3.5, 8).translate(0, 8, 0);
            const designerTreeGeo = BufferGeometryUtils.mergeBufferGeometries([trunkGeo, lv1, lv2]);
            const designerTreeInst = new THREE.InstancedMesh(designerTreeGeo, new THREE.MeshStandardMaterial({ color: 0x2e8b57 }), Math.ceil(count / 4));

            // Dashed lane markings on the road (replaces railway sleepers)
            const laneGeo = new THREE.BoxGeometry(2.5, 0.08, 0.4);
            const laneInst = new THREE.InstancedMesh(laneGeo, new THREE.MeshStandardMaterial({ color: 0xfff4d6, emissive: 0x554400, emissiveIntensity: 0.15 }), Math.ceil(sampledPoints.length / 10));

            const dummy = new THREE.Object3D();

            for (let i = 0; i < count; i++) {
                const p = sampledPoints[i * itemSpacing];
                const side = (i % 2 === 0) ? 1 : -1;
                const offset = 5 + Math.random() * 6;

                dummy.position.set(p.x + offset * side, 0.5, p.z + offset * side);
                dummy.scale.setScalar(0.8 + Math.random() * 0.5);
                dummy.updateMatrix();
                flowerInsts[i % 5].setMatrixAt(Math.floor(i / 5), dummy.matrix);

                if (i % 4 === 0) {
                    dummy.position.set(p.x - offset * side * 2.8, 0, p.z - offset * side * 2.8);
                    dummy.scale.setScalar(0.8 + Math.random() * 0.6);
                    dummy.updateMatrix();
                    designerTreeInst.setMatrixAt(Math.floor(i / 4), dummy.matrix);
                }
            }

            for (let i = 0; i < Math.floor(sampledPoints.length / 10); i++) {
                const p = sampledPoints[i * 10];
                dummy.position.copy(p);
                dummy.position.y = 0.08;
                dummy.scale.set(1, 1, 1);
                if (i * 10 < sampledPoints.length - 1) {
                    dummy.lookAt(sampledPoints[i * 10 + 1]);
                    dummy.rotateY(Math.PI / 2);
                }
                dummy.updateMatrix();
                laneInst.setMatrixAt(i, dummy.matrix);
            }

            scene.add(designerTreeInst, laneInst);
            flowerInsts.forEach(m => scene.add(m));
        }
        createFabulousNature();

        // Bus stop labels
        const loader = new FontLoader();
        loader.load('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', (font) => {
            routeStops.forEach(m => {
                const g = new TextGeometry(m.name.split(' (')[1] ? m.name.split(' (')[1].replace(')', '') : m.name, { font, size: 10, height: 2 });
                const msh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: m.color, emissive: m.color, emissiveIntensity: 0.2 }));
                msh.position.set((m.lon - startLon) * scale, 30, -(m.lat - startLat) * scale);
                msh.rotation.x = -Math.PI / 4;
                scene.add(msh);
            });
        });

        // --- SOLO PERFECT COACH BUS (replaces the locomotive) ---
        function createBus() {
            const masterGroup = new THREE.Group();
            const busModel = new THREE.Group();

            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x17a589, metalness: 0.3, roughness: 0.25 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x9fe7ff, metalness: 0.1, roughness: 0.1, emissive: 0x1c4966, emissiveIntensity: 0.15 });
            const trimMat = new THREE.MeshStandardMaterial({ color: 0xf4b400, metalness: 0.4, roughness: 0.3 });
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });

            // Main body
            const body = new THREE.Mesh(new THREE.BoxGeometry(4.6, 1.9, 2), bodyMat);
            body.position.y = 1.3; busModel.add(body);

            // Rounded roof cap
            const roof = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 4.6, 12, 1, false, 0, Math.PI), roof_mat_fix());
            function roof_mat_fix() { return bodyMat; }
            roof.rotation.z = Math.PI / 2;
            roof.position.set(0, 2.25, 0);
            busModel.add(roof);

            // Window band
            const windowBand = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.7, 2.02), glassMat);
            windowBand.position.set(0, 1.65, 0); busModel.add(windowBand);

            // Windshield
            const windshield = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.1, 1.9), glassMat);
            windshield.position.set(2.28, 1.6, 0); busModel.add(windshield);

            // Front bumper / trim stripe
            const stripe = new THREE.Mesh(new THREE.BoxGeometry(4.62, 0.25, 2.05), trimMat);
            stripe.position.set(0, 0.95, 0); busModel.add(stripe);

            // Headlights
            [1, -1].forEach(side => {
                const light = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), new THREE.MeshStandardMaterial({ color: 0xfff6c8, emissive: 0xffe066, emissiveIntensity: 0.8 }));
                light.position.set(2.3, 1.1, side * 0.8);
                busModel.add(light);
            });

            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.35, 16);
            [[1.5, 0.42, 1.05], [1.5, 0.42, -1.05], [-1.5, 0.42, 1.05], [-1.5, 0.42, -1.05]].forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.x = Math.PI / 2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                busModel.add(wheel);
            });

            busModel.rotation.y = -Math.PI / 2; // Axis fix
            masterGroup.add(busModel);
            scene.add(masterGroup); return masterGroup;
        }
        const bus = createBus();

        // --- Animation Logic ---
        let currentIdx = 0;
        const speedSlider = document.getElementById('speedSlider');
        let moveSpeed = 0.2;
        speedSlider.oninput = () => { moveSpeed = parseInt(speedSlider.value) / 20; };

        let camMode = 'orbit';
        const setCam = (m) => {
            camMode = m;
            document.querySelectorAll('.cam-btns button').forEach(b => b.classList.remove('active'));
            document.getElementById('view' + m.charAt(0).toUpperCase() + m.slice(1)).classList.add('active');
            controls.enabled = (m === 'orbit');
        };
        document.getElementById('viewOrbit').onclick = () => setCam('orbit');
        document.getElementById('viewTop').onclick = () => setCam('top');
        document.getElementById('viewFront').onclick = () => setCam('front');
        document.getElementById('viewSide').onclick = () => setCam('side');

        function animate() {
            requestAnimationFrame(animate);
            currentIdx += moveSpeed;
            if (currentIdx >= pathResolution) currentIdx = 0;

            const pos = sampledPoints[Math.floor(currentIdx)];
            const lookPos = sampledPoints[(Math.floor(currentIdx) + 4) % pathResolution];

            bus.position.copy(pos);
            bus.lookAt(lookPos);

            // Camera View
            if (camMode === 'orbit') {
                controls.target.lerp(bus.position, 0.1);
            } else if (camMode === 'top') {
                camera.position.lerp(new THREE.Vector3(bus.position.x, 220, bus.position.z), 0.1);
                camera.lookAt(bus.position);
            } else if (camMode === 'front') {
                const dir = lookPos.clone().sub(pos).normalize();
                camera.position.lerp(bus.position.clone().add(new THREE.Vector3(0, 5, 0)).add(dir.multiplyScalar(1)), 0.2);
                camera.lookAt(bus.position.clone().add(dir.multiplyScalar(50)));
            } else if (camMode === 'side') {
                camera.position.lerp(bus.position.clone().add(new THREE.Vector3(60, 30, 60)), 0.05);
                controls.target.lerp(bus.position, 0.1);
            }

            // Sync UI
            const gIdx = Math.floor((currentIdx / pathResolution) * (journeyData.length - 1));
            document.getElementById('currentInfo').innerText = "🚌 " + journeyData[gIdx].place;
            document.getElementById('timeLog').innerText = journeyData[gIdx].time;

            controls.update();
            renderer.render(scene, camera);
        }
        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
        animate();
    </script>
</body>
</html>
